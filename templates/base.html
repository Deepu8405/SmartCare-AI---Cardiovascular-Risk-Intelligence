<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCare AI - Heart Risk Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/heroicons@2.0.18/24/outline/index.css">
        <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
    <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    
    /* 🌟 NEW ANIMATIONS */
    @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out; }
    
    .typing-dots span {
        display: inline-block;
        width: 8px; height: 8px; margin: 0 2px;
        background: rgba(255,255,255,0.6);
        border-radius: 50%;
        animation: typing 1.4s infinite both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    
    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); opacity: 0.5; }
        40% { transform: scale(1); opacity: 1; }
    }
</style>

</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1
                        class="text-2xl font-bold bg-gradient-to-r from-gray-900 to-gray-700 bg-clip-text text-transparent">
                        🩺 SmartCare AI
                    </h1>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <!-- <a href="https://www.youtube.com/watch?v=YGI-J-ggz9A&list=RDYGI-J-ggz9A&start_radio=1" class="text-gray-600 hover:text-blue-600 font-medium transition-colors" target="_blank">How to Use</a> -->
                   <a href="{{ url_for('how_to_use') }}" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">How to Use</a>
                    <a href="https://whimsical-conkies-ad5d60.netlify.app/" class="text-gray-600 hover:text-blue-600 font-medium transition-colors" target="_blank">Contact Me</a>
                </div>
                <!-- TOP-RIGHT NAVBAR - REPLACE ENTIRE #auth-nav -->
                <!-- DYNAMIC NAVBAR - Shows Welcome/Logout WHEN LOGGED IN -->
                <div id="auth-nav" data-auth="{% if session.get('user') %}1{% else %}0{% endif %}"
                    class="flex items-center space-x-4">

                    {% if session.get('user') %}
                    <!-- ✅ LOGGED IN - Welcome + Logout -->
                    <div
                        class="flex items-center space-x-3 bg-green-50 px-4 py-2 rounded-2xl border border-green-200 shadow-sm">
                        <span class="text-sm font-bold text-green-800 flex items-center gap-1">
                            👋 Hi, {{ session['user']|capitalize }}
                        </span>
                        <form hx-post="/logout" hx-target="#auth-nav" hx-swap="outerHTML" style="display:inline;">
                            <button type="submit"
                                class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md hover:shadow-lg transition-all">
                                Logout
                            </button>
                        </form>
                    </div>
                    {% else %}
                    <!-- 🔐 NOT LOGGED IN - Login Button -->
                    <a href="/login"
                        class="bg-gradient-to-r from-blue-600 to-emerald-600 text-white px-8 py-3 rounded-2xl font-bold shadow-xl hover:from-blue-700 hover:to-emerald-700 transform hover:-translate-y-0.5 transition-all">
                        🔐 Login
                    </a>
                    {% endif %}
                </div>


            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <!-- AI Assistant Modal -->
    <!-- AI Assistant Modal - FIXED Cross + Send -->
    <div id="assistant-modal"
        class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col border border-gray-200 overflow-hidden">

            <!-- HEADER WITH WORKING CROSS -->
            <div class="p-6 border-b bg-gradient-to-r from-blue-50 to-emerald-50">
                <div class="flex justify-between items-center">
                    <h3
                        class="text-2xl font-bold bg-gradient-to-r from-gray-900 to-blue-900 bg-clip-text text-transparent flex items-center gap-3">
                        🤖 AI Doctor Assistant
                    </h3>
                    <button id="close-chat"
                        class="p-2 -m-2 rounded-2xl hover:bg-red-100 hover:text-red-600 transition-all group">
                        <svg class="w-6 h-6 group-hover:rotate-90 transition-all" fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- CHAT MESSAGES -->
            <div id="chat-messages" class="flex-1 p-6 overflow-y-auto bg-gradient-to-b from-gray-50 to-white space-y-4">
                <div class="p-4 bg-blue-100 rounded-2xl max-w-md mx-auto text-center opacity-75">
                    <p>💬 Ask about patient risk factors, tests, medications, or lifestyle advice</p>
                </div>
            </div>

            <!-- CHAT INPUT - WORKING SEND -->
            <div class="p-6 border-t bg-white">
                <div class="flex gap-3">
                    <input id="chat-input" type="text" placeholder="Type your question about this patient..."
                        class="flex-1 border-2 border-gray-300 rounded-2xl px-5 py-3 text-lg focus:ring-4 ring-blue-500/20 focus:border-blue-500 focus:outline-none transition-all shadow-sm">
                    <button id="chat-send"
                        class="bg-gradient-to-r from-blue-600 to-emerald-600 text-white px-8 py-3 rounded-2xl font-bold text-lg shadow-xl hover:from-blue-700 hover:to-emerald-700 transform hover:-translate-y-1 hover:shadow-2xl transition-all flex items-center gap-2 min-w-[100px] justify-center">
                        <span>Send</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-2-9-9 2 2 9z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- Floating AI Agent -->
    <!-- BIGGER Floating AI Agent (w-28 h-28) -->
    <div id="ai-agent"
        class="fixed bottom-8 right-8 w-28 h-28 bg-gradient-to-br from-purple-500 via-pink-500 to-indigo-600 
     rounded-full shadow-2xl hover:shadow-purple-500/50 cursor-pointer transform hover:scale-110 hover:rotate-6 transition-all duration-500 
     flex items-center justify-center z-40 border-4 border-white/30 ring-4 ring-purple-400/30 backdrop-blur-sm animate-pulse-slow"
        onclick="if(document.getElementById('auth-nav').innerHTML.includes('Logout')){document.getElementById('assistant-modal').classList.remove('hidden');} else {window.location.href='/login';}">
        <div class="text-4xl drop-shadow-lg">🤖</div>
    </div>

    <style>
        @keyframes pulse-slow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .animate-pulse-slow {
            animation: pulse-slow 3s ease-in-out infinite;
        }
    </style>



    <!-- Load External JavaScript -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
